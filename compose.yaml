services:
  social-api:
    image: ${API_IMAGE:-social-api:2.3.0}
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${API_PORT:-4004}:8000"
    environment:
      ENABLE_DOCS: "${ENABLE_DOCS:-false}"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 70s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
